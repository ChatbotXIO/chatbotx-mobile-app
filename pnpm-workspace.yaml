allowBuilds:
  '@parcel/watcher': true
  dtrace-provider: false
  esbuild: true
  lefthook: true
  unrs-resolver: true
# Expo SDK 58's compatibility check expects TypeScript 6; openapi-typescript's v7 peer range has not caught up.
peerDependencyRules:
  allowedVersions:
    'openapi-typescript@7.13.0>typescript': '6'
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.19 || 58.1.21 || 58.1.22'
  - '@expo/config-plugins@58.0.12 || 58.0.14'
  - '@expo/config@58.0.11 || 58.0.13'
  - '@expo/env@2.5.4'
  - '@expo/fingerprint@0.21.9 || 0.22.0'
  - '@expo/inline-modules@0.2.9 || 0.2.11'
  - '@expo/local-build-cache-provider@58.0.11 || 58.0.13'
  - '@expo/log-box@58.0.15'
  - '@expo/metro-config@58.0.21 || 58.0.23 || 58.0.24'
  - '@expo/metro-runtime@58.0.17'
  - '@expo/prebuild-config@58.0.19 || 58.0.21'
  - '@expo/router-server@58.0.21 || 58.0.23 || 58.0.24'
  - babel-preset-expo@58.0.24 || 58.0.26 || 58.0.27
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-linking@58.0.16
  - expo-modules-autolinking@58.0.17

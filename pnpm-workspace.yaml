  - expo-router@58.0.30 || 58.0.32 || 58.0.33
  - expo-splash-screen@58.0.13 || 58.0.15
  - expo@58.0.23 || 58.0.25 || 58.0.26 || 58.1.0
  - jest-expo@58.0.14 || 58.0.15 || 58.0.16
  - expo-updates@58.0.21 || 58.0.23
  - expo-dev-client@58.0.20 || 58.0.21 || 58.0.22
  - expo-dev-launcher@58.0.20 || 58.0.21 || 58.1.0
  - expo-file-system@58.0.14 || 58.0.15
